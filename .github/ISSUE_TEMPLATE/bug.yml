name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve MMA Pick'em.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the event, shared URL if safe, and exact steps.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Deployment version or commit SHA, if known.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, screenshots, logs, or other useful details.
