name: Submit IndexNow URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    if: ${{ vars.PUBLIC_BASE_URL != '' && vars.INDEXNOW_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Submit canonical sitemap URLs
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python scripts/submit_indexnow.py
