name: Publish and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish to GHCR
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    needs: publish
    # Nothing deploys until the owner configures Google Cloud. After that, only a
    # manual run on main deploys, unless CLOUD_RUN_AUTO_DEPLOY is set to "true".
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.CLOUD_RUN_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Validate deployment configuration
        run: |
          for name in \
            GCP_REGION \
            GAR_REPOSITORY \
            CLOUD_RUN_SERVICE \
            CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT
          do
            test -n "${!name}" || { echo "::error::Missing repository variable: ${name}"; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Copy image to Artifact Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
        run: |
          target_image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker pull "${SOURCE_IMAGE}"
          docker tag "${SOURCE_IMAGE}" "${target_image}"
          docker push "${target_image}"

      - name: Render service definition
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          ADSENSE_SLOT_ID: ${{ vars.ADSENSE_SLOT_ID }}
          REDIS_URL_SECRET: ${{ vars.CLOUD_RUN_REDIS_URL_SECRET }}
        run: |
          export BUILD_SHA="${GITHUB_SHA}"
          export IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          deploy/render-service.sh > "${RUNNER_TEMP}/service.yaml"

      # `services replace` never changes IAM policy, so a new service stays
      # private until the owner explicitly grants public access.
      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace "${RUNNER_TEMP}/service.yaml" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --quiet

      - name: Verify deployment
        run: |
          service_url="$(
            gcloud run services describe "${CLOUD_RUN_SERVICE}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --format 'value(status.url)'
          )"
          # The startup probe already gated the revision on /api/ready. A
          # private service answers 403 to unauthenticated requests.
          status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --retry 8 --retry-all-errors --retry-delay 2 \
              "${service_url}/api/ready" || true
          )"
          case "${status}" in
            200) access="public" ;;
            403) access="private (IAM invoker check)" ;;
            *) echo "::error::Unexpected status ${status} from ${service_url}/api/ready"; exit 1 ;;
          esac
          {
            echo "### Deployment"
            echo "- URL: ${service_url}"
            echo "- Access: ${access}"
          } >> "${GITHUB_STEP_SUMMARY}"
