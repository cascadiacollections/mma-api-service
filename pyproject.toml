[project]
name = "mma-api-service"
version = "0.1.0"
description = "REST API and web interface for UFC pick'em cards"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kevin T. Coughlin", email = "706967+KevinTCoughlin@users.noreply.github.com" },
]
keywords = ["fastapi", "mma", "pick-em", "ufc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.117.1,<1",
  "httpx>=0.28.1,<1",
  "redis>=6.4.0,<7",
  "uvicorn[standard]>=0.36.0,<1",
]

[project.urls]
Homepage = "https://github.com/cascadiacollections/mma-api-service"
Issues = "https://github.com/cascadiacollections/mma-api-service/issues"
Repository = "https://github.com/cascadiacollections/mma-api-service"

[dependency-groups]
dev = [
  "pytest>=8.4.2,<9",
  "pytest-asyncio>=1.2.0,<2",
  "ruff>=0.13.1,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
